<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceHub - Cập nhật mục Khác</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6; --income: #10b981; --expense: #ef4444;
            --glass: rgba(255, 255, 255, 0.75);
            --bg: linear-gradient(135deg, #e0f2f1 0%, #fce4ec 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); min-height: 100vh; display: flex; padding: 20px; color: #1e293b; }

        /* Sidebar */
        .sidebar {
            width: 260px; background: var(--glass); backdrop-filter: blur(15px);
            border-radius: 24px; padding: 40px 20px; display: flex; flex-direction: column; gap: 10px;
            border: 1px solid rgba(255,255,255,0.3); position: sticky; top: 20px; height: calc(100vh - 40px);
        }
        .nav-item { padding: 14px 20px; border-radius: 15px; cursor: pointer; color: #64748b; display: flex; align-items: center; gap: 12px; font-weight: 600; transition: 0.3s; }
        .nav-item.active { background: white; color: var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* Main Content */
        .main-content { flex: 1; padding-left: 30px; display: flex; flex-direction: column; gap: 25px; }
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        .card { background: var(--glass); backdrop-filter: blur(15px); border-radius: 24px; padding: 25px; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.03); }

        .balance-val { font-size: 45px; font-weight: 800; margin: 15px 0; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 18px; border-radius: 12px; border: 1px solid #e2e8f0; background: rgba(255,255,255,0.5); outline: none; }
        .btn-primary { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-delete { background: #fee2e2; color: #ef4444; border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; }

        /* Hiệu ứng cho ô nhập mục Khác */
        #otherCatContainer { display: none; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div style="font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 30px;">💎 FinanceHub</div>
    <div class="nav-item active" onclick="switchTab(event, 'overview')" data-lang="menu_home">🏠 Tổng quan</div>
    <div class="nav-item" onclick="switchTab(event, 'analysis')" data-lang="menu_analysis">📈 Phân tích</div>
    <div class="nav-item" onclick="switchTab(event, 'settings')" data-lang="menu_settings">⚙️ Cài đặt</div>
</aside>

<main class="main-content">
    <h1 id="pageTitle" style="font-size: 28px; font-weight: 800;" data-lang="title_home">Tổng quan tài chính</h1>

    <div id="overview" class="tab-content active">
        <div class="dashboard-grid">
            <div style="display: flex; flex-direction: column; gap: 25px;">
                <div class="card" style="border-top: 8px solid #bbf7d0; text-align: center;">
                    <span style="color:#64748b; font-weight:700; font-size:14px;" data-lang="balance_label">SỐ DƯ HIỆN TẠI</span>
                    <div class="balance-val" id="mainBalance">0</div>
                </div>
                <div class="card">
                    <h3 data-lang="history_label">Hoạt động gần đây</h3>
                    <table style="width:100%; border-collapse: collapse; margin-top: 15px;"><tbody id="historyBody"></tbody></table>
                </div>
            </div>

            <div class="card">
                <h3 data-lang="add_label">Thêm giao dịch</h3>

                <label style="font-size: 12px; font-weight: 700;">Danh mục</label>
                <select id="cat" onchange="checkOther(this.value)">
                    <option value="Ăn uống">🍴 Ăn uống</option>
                    <option value="Di chuyển">🚗 Di chuyển</option>
                    <option value="Sức khỏe">🧘 Sức khỏe</option>
                    <option value="Tiền lương">💰 Tiền lương</option>
                    <option value="Khác">✨ Khác...</option>
                </select>

                <div id="otherCatContainer">
                    <label style="font-size: 12px; font-weight: 700;">Tên danh mục mới</label>
                    <input type="text" id="otherValue" placeholder="Ví dụ: Sửa máy tính...">
                </div>

                <label style="font-size: 12px; font-weight: 700;">Số tiền</label>
                <input type="number" id="amt" placeholder="Nhập số tiền...">

                <label style="font-size: 12px; font-weight: 700;">Loại</label>
                <select id="type">
                    <option value="expense">Chi tiêu (-)</option>
                    <option value="income">Thu nhập (+)</option>
                </select>

                <button class="btn-primary" onclick="addTransaction()" data-lang="btn_save">Lưu giao dịch</button>
                <div style="margin-top: 25px;"><canvas id="miniChart"></canvas></div>
            </div>
        </div>
    </div>

    <div id="analysis" class="tab-content">
        <div class="card" style="width: 100%;">
            <h3 data-lang="menu_analysis">Phân tích</h3>
            <div style="height: 400px; margin-top: 20px;"><canvas id="bigChart"></canvas></div>
        </div>
    </div>

    <div id="settings" class="tab-content">
        <div class="card" style="max-width: 500px;">
            <h3 data-lang="settings_header">Cài đặt</h3>
            <label style="margin-top:20px; display:block;" data-lang="set_lang">Ngôn ngữ</label>
            <select id="setLang" onchange="updateSettings()"><option value="vi">Tiếng Việt</option><option value="en">English</option></select>
            <label data-lang="set_curr">Tiền tệ</label>
            <select id="setCurr" onchange="updateSettings()"><option value="VND">VNĐ</option><option value="USD">USD</option></select>
            <hr style="margin: 25px 0; border: 0.5px solid #eee;">
            <button class="btn-primary" style="background: var(--expense);" onclick="resetData()" data-lang="btn_reset">Xóa tất cả</button>
        </div>
    </div>
</main>

<script>
    let transactions = JSON.parse(localStorage.getItem('fin_final_v5')) || [];
    let config = JSON.parse(localStorage.getItem('fin_config')) || { lang: 'vi', curr: 'VND' };
    let miniChart, bigChart;

    const langPack = {
        vi: {
            menu_home: "🏠 Tổng quan", menu_analysis: "📈 Phân tích", menu_settings: "⚙️ Cài đặt",
            title_home: "Tổng quan tài chính", balance_label: "SỐ DƯ HIỆN TẠI", history_label: "Hoạt động gần đây",
            add_label: "Thêm giao dịch", btn_save: "Lưu giao dịch", settings_header: "Cấu hình ứng dụng",
            set_lang: "Ngôn ngữ", set_curr: "Đơn vị tiền tệ", btn_reset: "Xóa tất cả dữ liệu"
        },
        en: {
            menu_home: "🏠 Overview", menu_analysis: "📈 Analysis", menu_settings: "⚙️ Settings",
            title_home: "Financial Overview", balance_label: "TOTAL BALANCE", history_label: "Recent Activities",
            add_label: "Add Transaction", btn_save: "Save Transaction", settings_header: "App Settings",
            set_lang: "Language", set_curr: "Currency", btn_reset: "Reset All Data"
        }
    };

    // Hàm kiểm tra nếu chọn "Khác"
    function checkOther(val) {
        const container = document.getElementById('otherCatContainer');
        container.style.display = (val === 'Khác') ? 'block' : 'none';
    }

    function switchTab(event, tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        document.getElementById('pageTitle').innerText = langPack[config.lang][`title_${tabId}`] || langPack[config.lang][`menu_${tabId}`].substring(3);
        if(tabId === 'analysis') renderBigChart();
    }

    function addTransaction() {
        let cat = document.getElementById('cat').value;
        const otherVal = document.getElementById('otherValue').value;
        const amtVal = parseFloat(document.getElementById('amt').value);

        if(cat === 'Khác' && otherVal) cat = "✨ " + otherVal;
        if(!amtVal) return alert("Vui lòng nhập tiền!");

        const saveAmt = config.curr === 'USD' ? amtVal * 25000 : amtVal;
        transactions.unshift({ id: Date.now(), cat, amt: saveAmt, type: document.getElementById('type').value, date: new Date().toLocaleDateString('vi-VN') });

        updateUI();
        // Reset form
        document.getElementById('amt').value = '';
        document.getElementById('otherValue').value = '';
        document.getElementById('cat').value = 'Ăn uống';
        checkOther('Ăn uống');
    }

    function deleteTransaction(id) {
        if(confirm("Xóa giao dịch này?")) {
            transactions = transactions.filter(t => t.id !== id);
            updateUI();
        }
    }

    function updateUI() {
        localStorage.setItem('fin_final_v5', JSON.stringify(transactions));
        const body = document.getElementById('historyBody');
        body.innerHTML = '';
        let bal = 0, chartData = {};

        transactions.forEach(t => {
            let displayAmt = config.curr === 'USD' ? t.amt / 25000 : t.amt;
            if(t.type === 'income') bal += displayAmt;
            else { bal -= displayAmt; chartData[t.cat] = (chartData[t.cat] || 0) + displayAmt; }

            body.innerHTML += `<tr>
                <td><strong>${t.cat}</strong></td>
                <td style="color:${t.type==='income'?'var(--income)':'var(--expense)'}; font-weight:700">
                    ${t.type==='income'?'+':'-'}${displayAmt.toLocaleString()}${config.curr==='VND'?'đ':'$'}
                </td>
                <td style="text-align:right"><button class="btn-delete" onclick="deleteTransaction(${t.id})">🗑️</button></td>
            </tr>`;
        });
        document.getElementById('mainBalance').innerText = bal.toLocaleString() + (config.curr === 'VND' ? 'đ' : '$');
        renderMiniChart(chartData);
    }

    function renderMiniChart(chartData) {
        const ctx = document.getElementById('miniChart').getContext('2d');
        if(miniChart) miniChart.destroy();
        miniChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: Object.keys(chartData), datasets: [{ data: Object.values(chartData), backgroundColor: ['#6ee7b7','#fb923c','#60a5fa','#f472b6','#a78bfa','#94a3b8'], borderWidth: 0 }] },
            options: { cutout: '75%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: {size:10} } } } }
        });
    }

    function renderBigChart() {
        const ctx = document.getElementById('bigChart').getContext('2d');
        if(bigChart) bigChart.destroy();
        bigChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Tháng 3', 'Tháng 4', 'Tháng 5'],
                datasets: [
                    { label: config.lang==='vi'?'Thu nhập':'Income', data: [5000000, 7000000, 8000000], backgroundColor: '#10b981' },
                    { label: config.lang==='vi'?'Chi tiêu':'Expense', data: [3000000, 4500000, 3500000], backgroundColor: '#ef4444' }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function updateSettings() {
        config.lang = document.getElementById('setLang').value;
        config.curr = document.getElementById('setCurr').value;
        localStorage.setItem('fin_config', JSON.stringify(config));
        applyLang();
        updateUI();
    }

    function applyLang() {
        const p = langPack[config.lang];
        document.querySelectorAll('[data-lang]').forEach(el => { el.innerText = p[el.getAttribute('data-lang')]; });
        document.getElementById('setLang').value = config.lang;
        document.getElementById('setCurr').value = config.curr;
    }

    function resetData() { if(confirm("Xóa hết?")) { localStorage.clear(); location.reload(); } }

    applyLang();
    updateUI();
</script>
</body>
</html>
